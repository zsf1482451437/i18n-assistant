<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i18nexus翻译管理器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>i18nexus翻译管理器</h1>

      <div class="section">
        <h2>翻译数据</h2>
        <div id="translation-status">加载中...</div>
        <pre id="translation-data" class="data-display"></pre>
        <button id="refresh-translations">刷新翻译数据</button>
      </div>

      <div class="section">
        <h2>应用翻译</h2>
        <div class="form-group">
          <label for="project-dir">项目目录:</label>
          <input
            type="text"
            id="project-dir"
            placeholder="请输入项目目录的完整路径"
          />
        </div>

        <div class="form-group">
          <label for="namespace">命名空间:</label>
          <select id="namespace">
            <option value="">请选择命名空间</option>
            <!-- 预定义命名空间将在这里通过JavaScript加载 -->
          </select>
        </div>

        <button id="apply-translations" disabled>应用翻译</button>
      </div>

      <div class="section">
        <h2>日志</h2>
        <div id="log-container" class="log-container"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
